; Copy this file to driver.ini and change the values.

[app]
; The address of the app.
url = https://paddock.example.com
; Your telemetry key from "Mi cuenta" in the app. Keep it secret.
key = pdc_CHANGE_ME

[collector]
; Samples per second. 20 is enough for speed and inputs. More uses more disk and upload.
sample_hz = 20
; The collector keeps each lap here before it sends it.
spool_dir = driver-spool
