; Copy this file to collector.ini and change the values.

[app]
; The address of the app, with https:// when it is on the internet.
url = https://paddock.example.com
; The collector key from the championship page of the app. Keep it secret.
key = pcc_CHANGE_ME

[server]
; The folders of the AC server. The collector only reads them.
results_dir = C:\assettocorsa\server\results
realpenalty_logs_dir = C:\assettocorsa\server\realpenalty\logs
; The server_cfg.ini that the server uses, for the time of day and the start grip.
; With Content Manager, it is the cfg folder of the server preset. Empty: not read.
server_cfg =

[collector]
; The collector keeps its own copy of each file and event here.
spool_dir = spool
; 0 turns the UDP listener off. To turn it on, add an extra plugin in Content Manager
; (Advanced > CM plugin > Extra plugins) with the address 127.0.0.1:<this port>.
udp_port = 0
; For the position replay: the collector asks the server for car positions. Put the
; UDP_PLUGIN_LOCAL_PORT of server_cfg.ini here, and set request_positions = true.
server_udp_port = 0
request_positions = false
position_interval_ms = 200
; Files older than this date are not sent. Empty: the date of the first start.
since =
